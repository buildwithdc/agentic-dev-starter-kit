[project]
name = "agentic-dev-env"
version = "0.2.0"
description = "Universal multi-assistant agentic development environment and governance tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.0.0",
    "requests>=2.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]
