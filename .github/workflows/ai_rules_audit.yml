name: AI Rules Governance & Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONUTF8: "1"

jobs:
  governance-audit:
    name: Multi-Tier Rule Compliance & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Authoritative Org Rules Sync Verification
        run: |
          python3 scripts/sync_org_rules.py --force

      - name: Run Multi-Tier Pre-Commit / PR Reviewer
        env:
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          python3 scripts/pre_commit_reviewer.py
