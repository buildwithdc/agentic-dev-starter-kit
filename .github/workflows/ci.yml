name: CI Lint, Tests & Binary Smoke Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Ruff Lint & Unittest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install Dependencies
        run: uv sync --group dev

      - name: Run Ruff Check
        run: uv run ruff check .

      - name: Run Unit Tests
        run: uv run python -m unittest discover -s tests/unit

      - name: Run Integration Tests
        run: uv run python -m unittest discover -s tests/integration

      - name: Smoke Test Portable Zipapp Build
        run: |
          uv run python scripts/build_binary.py --pyz-only
          python3 dist/agentic-dev.pyz --version
          python3 dist/agentic-dev.pyz auth --help
