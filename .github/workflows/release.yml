name: Release Standalone Binaries & Tooling Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Lint & Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Dependencies & Run Checks
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run python -m unittest discover -s tests/unit
          uv run python -m unittest discover -s tests/integration

  build-native:
    name: Build Native Binary (${{ matrix.asset_name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_path: dist/agentic-dev
            asset_name: agentic-dev-linux-amd64
            is_windows: false
          - os: macos-latest
            bin_path: dist/agentic-dev
            asset_name: agentic-dev-macos-arm64
            is_windows: false
          - os: windows-latest
            bin_path: dist/agentic-dev.exe
            asset_name: agentic-dev-windows-amd64.exe
            is_windows: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build Native Binary
        run: |
          uv sync --group dev
          uv run python scripts/build_binary.py --native-only

      - name: Smoke Test & Stage Asset (POSIX)
        if: ${{ !matrix.is_windows }}
        run: |
          chmod +x "${{ matrix.bin_path }}"
          ./${{ matrix.bin_path }} --version
          ./${{ matrix.bin_path }} auth --help
          mkdir -p upload
          cp "${{ matrix.bin_path }}" "upload/${{ matrix.asset_name }}"

      - name: Smoke Test & Stage Asset (Windows)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          & "${{ matrix.bin_path }}" --version
          & "${{ matrix.bin_path }}" auth --help
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          Copy-Item "${{ matrix.bin_path }}" "upload/${{ matrix.asset_name }}"

      - name: Upload Native Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: upload/${{ matrix.asset_name }}

  build-portable:
    name: Build Portable Zipapp & Script Bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Zipapp & Zip Bundle
        run: |
          python3 scripts/build_binary.py --pyz-only
          python3 dist/agentic-dev.pyz --version
          python3 dist/agentic-dev.pyz auth --help
          python3 scripts/package_tooling.py --output dist/dev-env-tooling.zip

      - name: Upload Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-bundles
          path: |
            dist/agentic-dev.pyz
            dist/dev-env-tooling.zip

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-native, build-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          chmod +x agentic-dev-linux-amd64 agentic-dev-macos-arm64 agentic-dev.pyz
          sha256sum agentic-dev-* agentic-dev.pyz dev-env-tooling.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/agentic-dev-linux-amd64
            release-assets/agentic-dev-macos-arm64
            release-assets/agentic-dev-windows-amd64.exe
            release-assets/agentic-dev.pyz
            release-assets/dev-env-tooling.zip
            release-assets/checksums.txt
